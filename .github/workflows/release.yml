name: Release

# Baut bei jedem Versions-Tag (vX.Y.Z) die Installer für Linux, macOS und
# Windows und veröffentlicht sie als GitHub-Release-Entwurf – Pendant zu
# PDF-Translator's build-bootstrap.yml, nur dass hier Tauris eigener
# Bundler (statt PyInstaller) die fertigen Installer erzeugt.
#
# Verlangt zwei Repository-Secrets für das Signieren der Update-Artefakte
# (siehe README, Abschnitt "Architektur des Auto-Updates"):
#   TAURI_SIGNING_PRIVATE_KEY          – Inhalt von .updater-signing.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD – leer lassen, Key wurde ohne Passwort erzeugt
#
# Struktur bewusst in drei Jobs aufgeteilt (create-release / build /
# publish-release) statt wie frueher der Matrix-Build direkt per tagName
# veroeffentlichen zu lassen: bei vier parallelen Matrix-Legs (macOS
# aarch64/x86_64, Linux, Windows) versuchte sonst jedes Leg gleichzeitig,
# das Release fuer denselben Tag zu suchen/anzulegen - das fuehrte zu
# vereinzelten 500ern von GitHub beim Asset-Upload. Jetzt legt genau ein
# Job das Release (als Entwurf) an, alle Matrix-Legs laden nur noch Assets
# in dieses eine Release hoch, und erst wenn alle vier durch sind, wird
# der Entwurf veroeffentlicht.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag muss zu package.json und tauri.conf.json passen
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Tag: $TAG_VERSION | package.json: $PKG_VERSION | tauri.conf.json: $TAURI_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::Versions-Mismatch: Tag v$TAG_VERSION muss mit package.json ($PKG_VERSION) und tauri.conf.json ($TAURI_VERSION) übereinstimmen."
            exit 1
          fi

  create-release:
    needs: check-version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Release-Entwurf anlegen
        id: create-release
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              name: `Telegram User Activities ${process.env.TAG}`,
              body: [
                'Installer für Linux, macOS und Windows unten unter "Assets".',
                'Unter Linux fuer automatische Updates die .AppImage nehmen -',
                '.deb/.rpm zeigen neue Versionen zwar an, muessen aber manuell',
                'neu heruntergeladen werden (Tauri-Einschraenkung, kein',
                'Selbst-Update ausserhalb von AppImage).',
                'Siehe Commit-Historie für Details zu diesem Release.'
              ].join('\n'),
              draft: true,
              prerelease: false
            })
            return data.id

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: ""
            args: ""
          - platform: "windows-latest"
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux-Systembibliotheken installieren
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential

      - name: Frontend-Abhängigkeiten installieren
        run: npm ci

      - name: Installer bauen & Assets hochladen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Release veröffentlichen (Entwurf aufheben)
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false
            })
